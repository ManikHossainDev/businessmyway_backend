version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: backend_mongoose_redis

    command: redis-server --appendonly yes --requirepass 1qazxsw2J%

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data: