version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: backend-app

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      redis:
        condition: service_healthy

    restart: always

  redis:
    expose:
      - "6379"