version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev

    container_name: backend-app-dev

    env_file:
      - .env

    ports:
      - "5005:5005"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      redis:
        condition: service_healthy

    environment:
      CHOKIDAR_USEPOLLING: "true"

    stdin_open: true
    tty: true

    restart: unless-stopped

  redis:
    ports:
      - "6379:6379"